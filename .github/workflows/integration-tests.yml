name: integration-tests

# Optional, manual-only: run it from the Actions tab if you want a hosted run.
# The same checks run locally with one command:  scripts/verify.sh
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  graphprint-twin:
    name: GraphPrint-Twin (Neo4j)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/01_graphprint_twin

    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: none
        ports:
          - 7687:7687
          - 7474:7474

    env:
      NEO4J_URI: bolt://localhost:7687
      # The bridge polls until Neo4j accepts Bolt connections (no image-specific health check needed).
      NEO4J_WAIT_SECONDS: "120"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/01_graphprint_twin/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests (FR-1, FR-3)
        run: NEO4J_URI= python -m pytest tests/test_plc_simulator.py tests/test_database.py

      - name: Telemetry pipeline, 10 cycles (FR-1 to FR-4)
        run: python src/main.py --cycles 10 --interval 1.0

      - name: Graph integration tests (FR-2 to FR-4)
        run: python -m pytest tests/test_integration.py

      - name: Upload traceback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphprint-twin-traceback
          path: projects/01_graphprint_twin/output/
          if-no-files-found: ignore

  bioprint-pid:
    name: BioPrint-PID (control + Westgard QC)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/02_bioprint_pid

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/02_bioprint_pid/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit and scenario tests (FR-1 to FR-4, 50-seed robustness)
        run: python -m pytest

      - name: 30 s extrusion run with acceptance checks
        run: python src/app.py

      - name: Upload dashboard and run data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bioprint-pid-dashboard
          path: projects/02_bioprint_pid/output/
          if-no-files-found: warn

  # Planned:
  #   v0.4.0  bioprint-guard   (OPC UA server -> gateway -> Neo4j assertion)
